<!DOCTYPE html>
<html>
<body style="margin:0;background:#10152b;overflow:hidden">
<canvas id="game" width="960" height="540" style="position:absolute;inset:0;margin:auto;display:block;width:min(100vw, 177.78vh);height:min(100vh, 56.25vw);background:#bb4a2a"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

const sprites = {};
['front', 'back', 'side', 'Afront', 'Aback', 'Aside'].forEach(name => {
  sprites[name] = new Image();
  sprites[name].src = name + '.png';
  sprites[name].onerror = () => console.log('Could not load ' + name + '.png');
});

const bg = new Image();
bg.src = 'map.png';
bg.onerror = () => console.log('Could not load map.png');

// ---- GREENHOUSE (new) ----
const soilImg = new Image();
soilImg.src = 'soil.png';   // your soil background
soilImg.onerror = () => console.log('Could not load soil.png');

// src = [sx, sy, sw, sh] crops the sprite out of its image (lettuce.png has a lot of empty space around it).
// w = how wide it is drawn on the 960x540 canvas.
const vegTypes = {
  lettuce:     { file: 'lettuce.png',     src: [12, 179, 48, 35], w: 50, name: 'lettuce', days: 40 },
  sweetpotato: { file: 'sweetpotato.png', src: [0, 0, 32, 29],    w: 40, name: 'sweet potato', days: 100 },
  tomato:      { file: 'tomato.png',      src: [0, 0, 36, 34],    w: 40, name: 'tomato', days: 80 }
};
Object.values(vegTypes).forEach(v => {
  v.img = new Image();
  v.img.src = v.file;
  v.img.onerror = () => console.log('Could not load ' + v.file);
});

// Planted vegetables: x, y are canvas coordinates (center of the sprite). Add or move them here.
// age = days the plant has already been growing (change these to whatever you like; use 0 for a brand new seed)
const plants = [
  { t: 'tomato', x: 115, y: 119, age: 40 },      { t: 'lettuce', x: 288, y: 76, age: 40 },
  { t: 'sweetpotato', x: 528, y: 108, age: 99 }, { t: 'tomato', x: 749, y: 184, age: 80 },
  { t: 'lettuce', x: 864, y: 97, age: 39 },      { t: 'sweetpotato', x: 192, y: 281, age: 100 },
  { t: 'tomato', x: 422, y: 248, age: 20 },      { t: 'lettuce', x: 634, y: 313, age: 30 },
  { t: 'sweetpotato', x: 845, y: 335, age: 60 }, { t: 'tomato', x: 134, y: 443, age: 64 },
  { t: 'lettuce', x: 365, y: 421, age: 38 },     { t: 'sweetpotato', x: 557, y: 464, age: 10 },
  { t: 'tomato', x: 768, y: 454, age: 8 }
];
const MUST_BE_RIPE = true;   // true = you can only pick a vegetable at 100%
function growth(pl) { return Math.min(1, pl.age / vegTypes[pl.t].days); }   // 0 to 1

// ---- EVENTS (solar flare / CME) ----
const events = [
  { day: 500, hour: 1, type: 'flare' },   // 9 AM (hour 0 = 8 AM)
  { day: 501, hour: 2, type: 'cme' }      // 10 AM
];
const FLARE_SECONDS = 10, CME_SECONDS = 45;
let ev = null, gameOver = false, solarDead = false;
const warnImg = new Image(); warnImg.src = 'warning.png';
warnImg.onerror = () => console.log('Could not load warning.png');
const deadImgs = {};
Object.keys(vegTypes).forEach(k => {
  deadImgs[k] = new Image(); deadImgs[k].src = 'dead_' + k + '.png';
  deadImgs[k].onerror = () => console.log('Could not load dead_' + k + '.png');
});

// one dashboard picture per day: dashboard500.png, dashboard501.png ... (falls back to dashboard.png)
const dayDashImgs = {};
function dashImageNow() {
  if (!(day in dayDashImgs)) { const i = new Image(); i.src = 'dashboard' + day + '.png'; dayDashImgs[day] = i; }
  const i = dayDashImgs[day];
  return i.complete && i.naturalWidth ? i : dashImg;
}

// The NASA app pictures may still be full 1280x720 screenshots with a white margin.
// If so, only the app part is cut out ([x, y, w, h] below), so they come out the same size as the app at the start.
const APP_CROP = [450, 74, 407, 432];
function drawAppPicture(img, r) {
  const full = img.naturalWidth === 1280 && img.naturalHeight === 720;
  if (full) ctx.drawImage(img, APP_CROP[0], APP_CROP[1], APP_CROP[2], APP_CROP[3], r.x, r.y, r.w, r.h);
  else ctx.drawImage(img, r.x, r.y, r.w, r.h);
}
function mmss(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function cropsLeft() { return ev.targets.filter(p => plants.includes(p) && !p.dead).length; }
const FLARE_STAY = 30, CME_STAY = 60;   // seconds you must stay inside after the first timer
function evPaused() { return ev && (ev.waiting || ev.phase === 'done'); }
function eventLines() {
  if (!ev) return [];
  const inH = scene === 'house', s = Math.max(0, Math.ceil(ev.t));
  if (ev.phase === 'stay') return [
    { text: ev.type === 'flare' ? 'The solar flare is still happening.' : 'The CME is still happening.' },
    { text: 'Stay inside your house for ' + mmss(s) + '.' },
    { text: 'Do not go outside!' }];
  if (ev.type === 'flare') return [
    { text: 'A solar flare is occurring.' },
    { text: 'You have ' + s + ' seconds to:' },
    { text: 'Go inside your house', done: inH }];
  const left = cropsLeft();
  return [
    { text: 'A CME is occurring.' },
    { text: 'You have ' + mmss(s) + ' to:' },
    { text: '1. Collect all ripe crops (' + left + ' left)', done: left === 0 },
    { text: '2. Go inside your house', done: inH },
    { text: '3. Store energy / stop solar panels', done: solarStopped }];
}
function startEvent(e) {
  e.fired = true; ask = null;
  // waiting = the warning is on screen; the timer only starts once you close it with the red button
  ev = { type: e.type, phase: 'go', waiting: true, t: e.type === 'flare' ? FLARE_SECONDS : CME_SECONDS,
         targets: e.type === 'cme' ? plants.filter(p => !p.dead && growth(p) >= 1) : [], result: [] };
}
function finishGoPhase() {   // the "get inside" timer is over: apply the results, then start the "stay inside" timer
  if (ev.type === 'cme') {
    let n = 0;
    ev.targets.forEach(p => { if (plants.includes(p) && !p.dead) { p.dead = true; n++; } });
    ev.result.push(n ? n + ' crop' + (n > 1 ? 's' : '') + ' died.' : 'All ripe crops were saved.');
    if (!solarStopped) { solarDead = true; ev.result.push('The solar panels are dead.'); }
    else ev.result.push('The solar panels were protected.');
  } else ev.result.push('You got inside in time.');
  ev.phase = 'stay';
  ev.t = ev.type === 'flare' ? FLARE_STAY : CME_STAY;
}
function updateEvent(dt) {
  ev.t -= dt;
  const inH = scene === 'house';
  if (ev.phase === 'go') {
    const ready = inH && (ev.type === 'flare' || (cropsLeft() === 0 && solarStopped));
    if (ready) finishGoPhase();
    else if (ev.t <= 0) { if (!inH) { endGame('You were caught outside.'); return; } finishGoPhase(); }
  } else if (ev.phase === 'stay') {
    if (!inH) { endGame('You were caught outside.'); return; }
    if (ev.t <= 0) ev.phase = 'done';
  }
}
function drawEvent() {
  if (!ev) return;
  if (ev.waiting || ev.phase === 'done') { ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  if (ev.waiting) {   // the warning pops up at the same size as the NASA app
    const r = dashRect();
    if (warnImg.naturalWidth) drawAppPicture(warnImg, r);
    else { ctx.fillStyle = '#b82424'; ctx.fillRect(r.x, r.y, r.w, r.h); }
    drawTextArea(r, eventLines(), { top: 170, color: '#ffffff', done: '#ffd0d0' });
    return;
  }
  if (ev.phase === 'done') {
    const lines = ev.result, h = 110 + lines.length * 26;
    panel(220, 270 - h / 2, 520, h);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3b2412';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText('The ' + (ev.type === 'flare' ? 'solar flare' : 'CME') + ' has finished.', 480, 270 - h / 2 + 32);
    ctx.font = 'bold 15px "Courier New", monospace';
    lines.forEach((l, i) => ctx.fillText(l, 480, 270 - h / 2 + 66 + i * 26));
    ctx.fillText('Click or press Enter to continue', 480, 270 + h / 2 - 22);
    return;
  }
  const s = Math.max(0, Math.ceil(ev.t));
  ctx.fillStyle = Math.floor(ev.t * 2) % 2 ? '#b82424' : '#7a1010';
  ctx.fillRect(330, 12, 300, 30);
  ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(330, 12, 300, 30);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText((ev.phase === 'stay' ? 'STAY INSIDE ' : ev.type === 'flare' ? 'SOLAR FLARE ' : 'CME ') + mmss(s), 480, 28);
}
function drawDeadPlant(pl) {
  const v = vegTypes[pl.t], im = deadImgs[pl.t];
  if (!im.complete || !im.naturalWidth) return;
  const base = pl.y + (v.w * v.src[3] / v.src[2]) / 2, h = v.w * im.naturalHeight / im.naturalWidth;
  ctx.drawImage(im, pl.x - v.w / 2, base - h, v.w, h);
  ctx.fillStyle = '#4a2e18'; ctx.fillRect(pl.x - v.w * 0.45, base - 3, v.w * 0.9, 3);
}

// ---- text that stays inside the app borders (wraps + scrolls) ----
const TEXT = { x: 44, w: 290, y: 240, h: 138 };   // text area inside the app, in dashboard.png units. Tweak if needed.
function wrapLines(lines, maxW) {
  const out = [];
  lines.forEach(l => {
    let cur = '';
    l.text.split(' ').forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && cur) { out.push({ text: cur, done: l.done }); cur = w; } else cur = t;
    });
    out.push({ text: cur, done: l.done });
  });
  return out;
}
function drawTextArea(r, lines, o) {
  o = o || {};
  const top = o.top || TEXT.y, h = TEXT.y + TEXT.h - top, lh = 24;
  ctx.save();
  ctx.font = 'bold ' + 16 * r.sx + 'px "Courier New", monospace';
  const wrapped = wrapLines(lines, TEXT.w * r.sx);
  const max = Math.max(0, wrapped.length * lh - h), sc = Math.min(o.scroll || 0, max);
  ctx.beginPath(); ctx.rect(r.x + TEXT.x * r.sx, r.y + top * r.sy, TEXT.w * r.sx, h * r.sy); ctx.clip();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  wrapped.forEach((l, i) => {
    const x = r.x + TEXT.x * r.sx, y = r.y + (top + i * lh - sc) * r.sy;
    ctx.fillStyle = l.done ? (o.done || '#5a6585') : (o.color || '#10152b');
    ctx.fillText(l.text, x, y);
    if (l.done) ctx.fillRect(x, y + 8 * r.sy, ctx.measureText(l.text).width, Math.max(2, 2 * r.sy));
  });
  ctx.restore();
  if (max > 0) {   // scroll hints
    ctx.fillStyle = o.color || '#10152b'; ctx.font = 'bold ' + 14 * r.sx + 'px Arial'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const hx = r.x + (TEXT.x + TEXT.w) * r.sx;
    if (sc > 0) ctx.fillText('\u25B2', hx, r.y + (top + 6) * r.sy);
    if (sc < max) ctx.fillText('\u25BC', hx, r.y + (TEXT.y + TEXT.h - 6) * r.sy);
  }
  return sc;
}
canvas.addEventListener('wheel', e => {
  if (dash.open) { dash.scroll = Math.max(0, dash.scroll + Math.sign(e.deltaY) * 24); e.preventDefault(); }
}, { passive: false });

const REACH = 140;      // how close (px) the character must be to a vegetable to pick it
let scene = 'outside';  // 'outside' = your map, 'greenhouse' = the soil room, 'house' = inside the house
let basket = 0;
let pickedToday = 0;   // task 1 counts the vegetables picked today
const START_DAY = 500;
let day = START_DAY;
// bin and basket hold the crops by type. Every item is stored as the day it was picked, so we know when it rots.
const bin = { lettuce: [], sweetpotato: [], tomato: [] };
const basketItems = { lettuce: [], sweetpotato: [], tomato: [] };
const mealsList = [];       // cooked meals, each stored as the day it was cooked
let energy = 0;             // energy in storage, 0-100%. Starts at 0 on day 500 and is charged by the solar panels.
let energyArmed = false;    // becomes true once energy has been above 0, so starting at 0 is not game over
let gameOverReason = '';
function endGame(why) { gameOver = true; gameOverReason = why || ''; }
let lastHour = 0;
let solarStopped = false;
let bedArmed = true;
let showLabels = false;     // press I
let hudOpen = false;        // V or click the drop-down tab: shows/hides the status bars and the Guide / How to play buttons

// ---- Clock, energy and tasks ----
const HOUR_SECONDS = 30;      // real seconds per in-game hour
const GAIN_MAX = 12;          // energy gained per hour at 100% solar capacity (so 60% capacity = 7.2% per hour)
const DRAIN = 3;              // energy the base uses every hour while the solar panels are running
const STOPPED_DRAIN = 10;     // energy the base uses every hour while the panels are STOPPED (and nothing recharges)
const REFILL_COST = 4;        // % energy it costs to refill the oxygen tank
const COOK_COST = 3;          // % energy it costs to cook one meal
const OXY_HOURS = 2;          // if the oxygen is not refilled after this many in-game hours...
const OXY_SECONDS = 10;       // ...you get a low-oxygen alert and this many seconds to refill it
const SHELF = { lettuce: 3, tomato: 2, sweetpotato: 8 };   // days a picked crop lasts before it rots
const MEAL_SHELF = 2;         // days a cooked meal lasts before it goes bad
const DAY_HOURS = 12;         // 8 AM to 8 PM
const DAY_SECONDS = DAY_HOURS * HOUR_SECONDS;
function hoursPassed() { return Math.min(DAY_HOURS, Math.floor(gameTime / HOUR_SECONDS)); }
let gameTime = 0;             // real seconds played so far today
let dayOver = false;
// Eating: 1 cooked meal fills you up for the day, a raw crop only fills you half (so you need 2).
let eatenToday = 0, hungryDays = 0, hungerWarned = false;
let dayNotes = [];            // messages shown on the Warning tab for today
let lowEnergyWarned = false, stopRemind = 0;
const oxy = { alert: false, t: OXY_SECONDS, msg: 0 };
const tasks = [
  { text: 'Collect food at the greenhouse', need: 3, done: false },   // done when 3 vegetables are picked
  { text: 'Check the solar panels',          done: false },            // done when you walk up to the panels
  { text: 'Refill oxygen at the house',      done: false },            // done when you walk up to the house door
  { text: 'Eat 1 meal or 2 raw crops',       done: false }             // done when you have eaten enough today
];
// Where the character must stand to finish tasks 2 and 3 on map.png: [x, y, width, height]
const solarZone = [520, 100, 440, 60];
const houseDoorZone = [757, 455, 91, 35];
function inBox(b) { return player.x >= b[0] && player.x <= b[0] + b[2] && player.y >= b[1] && player.y <= b[1] + b[3]; }

// ---- food: rotting, eating ----
function refreshBinFull() { binFull = Object.keys(bin).some(t => bin[t].length > 0) || mealsList.length > 0; }
function spoilFood() {   // called on a new day: throws away everything that went bad, returns what was lost
  const lost = [];
  Object.keys(vegTypes).forEach(t => {
    let n = 0;
    [basketItems, bin].forEach(store => {
      const keep = store[t].filter(d => day - d < SHELF[t]);
      n += store[t].length - keep.length;
      store[t] = keep;
    });
    if (n) lost.push(n + ' ' + vegTypes[t].name);
  });
  const keepM = mealsList.filter(d => day - d < MEAL_SHELF);
  const nm = mealsList.length - keepM.length;
  if (nm) lost.push(nm + ' meal' + (nm > 1 ? 's' : ''));
  mealsList.length = 0; keepM.forEach(d => mealsList.push(d));
  basket = Object.keys(basketItems).reduce((a, t) => a + basketItems[t].length, 0);
  refreshBinFull();
  return lost;
}
function leftText(d) { return d <= 1 ? 'rots tomorrow' : 'rots in ' + d + ' days'; }
function stockLines() {   // what is in the bin, with how long it lasts (based on the oldest item)
  const out = [];
  Object.keys(bin).forEach(t => {
    const a = bin[t];
    if (a.length) out.push(a.length + ' ' + vegTypes[t].name + ' (' + leftText(SHELF[t] - (day - Math.min.apply(null, a))) + ')');
  });
  if (mealsList.length) out.push(mealsList.length + ' meal' + (mealsList.length > 1 ? 's' : '') + ' (' + leftText(MEAL_SHELF - (day - Math.min.apply(null, mealsList))) + ')');
  return out;
}
function soonRot() {   // things in the basket / bin that rot at the start of tomorrow
  const out = [];
  Object.keys(vegTypes).forEach(t => {
    const n = bin[t].concat(basketItems[t]).filter(d => SHELF[t] - (day - d) <= 1).length;
    if (n) out.push(n + ' ' + vegTypes[t].name);
  });
  const m = mealsList.filter(d => MEAL_SHELF - (day - d) <= 1).length;
  if (m) out.push(m + ' meal' + (m > 1 ? 's' : ''));
  return out;
}
function alertLines() {   // everything the player should know right now (shown on the Warning tab)
  const L = dayNotes.map(t => ({ text: t }));
  if (oxy.alert) L.push({ text: 'LOW OXYGEN! Refill the tank at the house in ' + Math.max(0, Math.ceil(oxy.t)) + ' seconds.' });
  if (eatenToday < 1) L.push({ text: 'You still need to eat today: 1 meal or 2 raw crops.' });
  const soon = soonRot();
  if (soon.length) L.push({ text: 'Rots tomorrow: ' + soon.join(', ') + '. Eat or cook it.' });
  if (solarStopped) L.push({ text: 'Solar panels are stopped. Energy is draining fast!' });
  if (energy < 25) L.push({ text: 'Low energy: ' + Math.round(energy) + '%.' });
  return L;
}
function newDay() {
  const hungry = eatenToday < 1;
  day++; gameTime = 0; dayOver = false; pickedToday = 0; ask = null; refill = null;
  lastHour = 0; bedArmed = false;
  ev = null; dash.scroll = 0;
  oxy.alert = false; oxy.t = OXY_SECONDS; oxy.msg = 0;
  eatenToday = 0; hungerWarned = false; stopRemind = 0;
  tasks.forEach(t => t.done = false);
  plants.forEach(pl => { if (!pl.dead) pl.age = Math.min(vegTypes[pl.t].days, pl.age + 1); });   // every plant grows one day
  const lost = spoilFood();
  hungryDays = hungry ? hungryDays + 1 : 0;
  dayNotes = [];
  if (hungry) dayNotes.push(hungryDays >= 2 ? 'You starved.' : 'You went to bed hungry! Eat tomorrow or you will starve.');
  if (lost.length) dayNotes.push('Food rotted: ' + lost.join(', ') + '.');
  dayNotes.push('Day ' + day + ': your plants grew a little.');
  toast = { text: dayNotes[0], t: 5 };
  dash.open = true; dash.tab = (hungry || lost.length) ? 'warning' : null;   // the app pops up again with the new day's info
  if (hungry && hungryDays >= 2) endGame('You starved.');
}
function clockText() {
  const h24 = 8 + hoursPassed();
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  return h12 + ':00 ' + (h24 >= 12 ? 'PM' : 'AM');   // jumps once per hour, minutes are not shown
}
let ask = null;         // the yes/no question on screen: { x, y, text, onYes }
let refill = null;      // { t } while the oxygen tank is refilling
const BASKET_MAX = 5;   // the basket holds 5 items until you empty it into the bin at the house
let binFull = false;    // true while something is in the bin
const REFILL_SECONDS = 5;
let toast = { text: '', t: 0 };

// Greenhouse walkable box (the character's feet stay inside it).
const greenhouseWalk = [[40, 130, 880, 380]];

// The greenhouse door (the dome) on map.png: [x, y, width, height]. Walking into it enters the greenhouse.
// To adjust it: press P, then O, click two corners, press C and paste the printed greenhouseDoor line here.
let greenhouseDoor = [124, 300, 80, 45];   // the dome's door on map.png (bottom of the door, touching the left path)
let returnSpot = { x: 410, y: 300 };
let doorArmed = true;   // after coming out, you must step away from the door before it can trigger again

function enterGreenhouse() {
  returnSpot = { x: player.x, y: player.y };
  scene = 'greenhouse'; player.x = 480; player.y = 480; player.view = 'back'; ask = null;
}
function exitGreenhouse() {
  scene = 'outside'; player.x = returnSpot.x; player.y = returnSpot.y; player.view = 'front';
  player.suit = true;   // space suit back on outside
  ask = null; doorArmed = false;
}
// ---- the house: the character takes off the space suit inside ----
// Inside pictures (rename here if your files have other names). Empty bin first, bin full of stuff second.
const houseEmptyImg = new Image(); houseEmptyImg.src = 'empty.png';
const houseFullImg = new Image();  houseFullImg.src = 'full.png';
// Rectangles are [x, y, w, h] measured on the 1280x720 picture; sc() turns them into game coordinates.
function sc(list) { return list.map(r => r.map(v => v * 0.75)); }
const houseWalk = sc([            // where the light gray floor is
  [335, 150, 880, 448],           // main room
  [672, 598, 157, 122],           // corridor to the outside door at the bottom
  [165, 60, 150, 120],            // floor above the oxygen tank
  [22, 180, 300, 200],            // floor around the oxygen tank
  [20, 380, 290, 120],
  [60, 500, 250, 100],
  [190, 600, 115, 60],
  [300, 365, 60, 70]              // opening between the tank area and the main room
]);
const houseBlock = sc([           // things you can't walk through
  [50, 180, 185, 330], [180, 55, 125, 95],   // oxygen tank
  [315, 78, 20, 285],                         // wall next to the tank
  [625, 150, 170, 220],                       // table
  [548, 155, 58, 80], [553, 268, 58, 82], [808, 165, 60, 76], [813, 265, 60, 80],   // chairs
  [978, 78, 242, 250], [900, 78, 80, 57],     // bed and bedside table
  [315, 435, 275, 170],                       // bathroom
  [890, 515, 330, 90],                        // counter
  [1150, 420, 70, 95],                        // bin
  [825, 540, 62, 58]                          // plant pot
]);
const oxygenRect = sc([[180, 55, 125, 95]])[0];    // the small tank
const storageRect = sc([[50, 180, 185, 330]])[0];  // the big tank = energy storage
const binRect = sc([[1150, 420, 70, 95]])[0];
const bedRect = sc([[978, 78, 242, 250]])[0];
const bowlRect = sc([[915, 525, 55, 32]])[0];
const HOUSE_REACH = 95;
const recipes = [
  { label: 'fries', name: 'Fries and ketchup', needs: { tomato: 1, sweetpotato: 1 } },
  { label: 'salad', name: 'Salad', needs: { lettuce: 2, tomato: 1 } }
];
function inList(list, x, y) { return list.some(r => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]); }
function nearRect(r, d) {
  const cx = player.x, cy = player.y - player.h / 2;
  return Math.hypot(Math.max(r[0] - cx, 0, cx - (r[0] + r[2])), Math.max(r[1] - cy, 0, cy - (r[1] + r[3]))) <= d;
}
function enterHouse() {
  returnSpot = { x: player.x, y: player.y };
  scene = 'house'; player.x = 562; player.y = 480; player.view = 'back'; player.suit = false; ask = null;
}
function drawHouseRoom() {
  const img = binFull ? houseFullImg : houseEmptyImg;

function dashRect(k) {
  const h = canvas.height * (k || 0.8);
  const w = h * 407 / 432;   // the app is always 407 x 432, whatever the picture files measure
  return { x: (canvas.width - w) / 2, y: (canvas.height - h) / 2, w, h, sx: w / 407, sy: h / 432 };
}

function dashClick(p) {
  const r = dashRect();
  const u = (p.x - r.x) / r.sx, v = (p.y - r.y) / r.sy;
  if (Math.hypot(u - 369, v - 35) <= 34) { dash.open = false; return; }
  dashTabs.forEach(t => {
    if (u >= t.x && u <= t.x + t.w && v >= 198 && v <= 228) { dash.tab = t.id; dash.scroll = 0; }
  });
}

function drawDash() {
  if (!dashImg.complete || !dashImg.naturalWidth) return;
  const r = dashRect();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawAppPicture(dashImageNow(), r);   // the picture for today's day number

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  dashTabs.forEach(t => {
    const bx = r.x + t.x * r.sx, by = r.y + 198 * r.sy, bw = t.w * r.sx, bh = 30 * r.sy;
    const hover = mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by && mouse.y <= by + bh;
    ctx.fillStyle = dash.tab === t.id ? '#ec6a3f' : hover ? '#7f9fd6' : '#5d7fb8';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#10152b';
    ctx.lineWidth = 3 * r.sx;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = '#10152b';
    ctx.font = 'bold ' + 14 * r.sx + 'px "Courier New", monospace';
    ctx.fillText(t.label, bx + bw / 2, by + bh / 2);
  });

  dash.scroll = drawTextArea(r, dashLines(dash.tab), { scroll: dash.scroll });
}

function update(dt) {
  if (gameOver) return;
  if (toast.t > 0) toast.t -= dt;
  if (oxy.msg > 0) oxy.msg -= dt;
  if (popups.length) { popups[0].t -= dt; if (popups[0].t <= 0) popups.shift(); }
  const paused = dash.open || evPaused();
  if (!paused && !dayOver) {
    gameTime += dt;
    if (gameTime >= DAY_SECONDS) { gameTime = DAY_SECONDS; dayOver = true; }
    // energy: the solar panels charge it (more when the weather is good), the base uses some every hour.
    // When the panels are stopped nothing recharges and the base uses much more.
    const drainNow = solarStopped ? STOPPED_DRAIN : DRAIN;
    energy = Math.max(0, Math.min(100, energy + (GAIN_MAX * solarCapacity() / 100 - drainNow) * dt / HOUR_SECONDS));
    if (energy > 0) energyArmed = true;
    else if (energyArmed) endGame('You ran out of energy.');
    if (energy < 25 && !lowEnergyWarned) { lowEnergyWarned = true; toast = { text: 'Low energy: ' + Math.round(energy) + '%. Keep the solar panels running!', t: 4 }; }
    if (energy > 35) lowEnergyWarned = false;
    if (solarStopped) {   // keep reminding the player that stopped panels drain the energy fast
      if (ev) stopRemind = 14;
      else { stopRemind += dt; if (stopRemind >= 15) { stopRemind = 0; toast = { text: 'Solar panels are still stopped! Energy is draining fast.', t: 3.5 }; } }
    } else stopRemind = 0;
    // oxygen: if it is not refilled after 2 hours, you get a low-oxygen alert and 10 seconds to refill it
    if (!oxy.alert && !tasks[2].done && !ev && hoursPassed() >= OXY_HOURS) { oxy.alert = true; oxy.t = OXY_SECONDS; oxy.msg = 4; }
    if (oxy.alert && !refill) { oxy.t -= dt; if (oxy.t <= 0) endGame('You ran out of oxygen.'); }
    // hunger reminder
    if (!hungerWarned && hoursPassed() >= 6 && eatenToday < 1) { hungerWarned = true; toast = { text: 'You still need to eat today! Cook a meal or eat 2 crops.', t: 4 }; }
    if (!ev) { const e = events.find(e => e.day === day && !e.fired && gameTime >= e.hour * HOUR_SECONDS); if (e) startEvent(e); }
    else updateEvent(dt);
  }
  if (refill && !paused && !dayOver) {
    refill.t += dt;
    if (refill.t >= REFILL_SECONDS) { refill = null; completeTask(2); oxy.alert = false; toast = { text: 'Oxygen tank refilled!', t: 2.5 }; }
  }
  if (paused || ask || refill || dayOver) return;
  let dx = 0, dy = 0;
  if (keys.arrowleft || keys.a)  { dx = -1; player.view = 'side'; player.flip = -1; }
  if (keys.arrowright || keys.d) { dx = 1;  player.view = 'side'; player.flip = 1; }
  if (keys.arrowup || keys.w)    { dy = -1; player.view = 'back'; }
  if (keys.arrowdown || keys.s)  { dy = 1;  player.view = 'front'; }

  const nx = player.x + dx * player.speed * dt;
  const ny = player.y + dy * player.speed * dt;
  if (walkable(nx, player.y)) player.x = nx;
  if (walkable(player.x, ny)) player.y = ny;

  if (pickedToday >= tasks[0].need) completeTask(0);

  if (scene === 'house') {
    if (!nearRect(bedRect, 70)) bedArmed = true;
    else if (bedArmed && !ask && !ev) { bedArmed = false; const m = mid(bedRect); openYesNo(m.x, bedRect[1] + bedRect[3], 'Go to bed?', () => newDay()); }
  }
  if (scene === 'outside' && !touchingDoor() && !inBox(houseDoorZone)) doorArmed = true;
  if (scene === 'outside' && doorArmed && touchingDoor()) enterGreenhouse();
  else if (scene === 'outside' && doorArmed && inBox(houseDoorZone)) enterHouse();
  else if (scene !== 'outside' && dy > 0 && player.y >= EXIT_Y - 1) exitGreenhouse();
}

function drawDebug() {

function drawPlayer() {
  ctx.save();
  ctx.translate(Math.round(player.x), Math.round(player.y));
  ctx.scale(player.view === 'side' ? player.flip : 1, 1);
  const img = sprites[(player.suit ? 'A' : '') + player.view];
  if (img.complete && img.naturalWidth) {
    const w = player.h * img.naturalWidth / img.naturalHeight;
    ctx.drawImage(img, -w / 2, -player.h, w, player.h);
  } else {
    ctx.fillStyle = '#ec6a3f';
    ctx.fillRect(-player.w / 2, -player.h, player.w, player.h);
  }
  ctx.restore();
}

function drawPlants() {
  const prev = ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled = false; // keeps the pixel art crisp
  plants.forEach(pl => {
    if (pl.dead) { drawDeadPlant(pl); return; }
    const v = vegTypes[pl.t];
    if (!v.img.complete || !v.img.naturalWidth) return;
    const fullH = v.w * v.src[3] / v.src[2], base = pl.y + fullH / 2, f = growth(pl);
    const hover = !ask && !debug && plantAt(mouse) === pl;
    // the sprite rises out of the soil: only the top part shows until fully grown
    if (f > 0) {
      const sh = Math.max(1, v.src[3] * f), dh = fullH * sh / v.src[3];
      if (hover) { ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 8; }
      ctx.drawImage(v.img, v.src[0], v.src[1], v.src[2], sh, pl.x - v.w / 2, base - dh, v.w, dh);
      if (hover) ctx.restore();
    }
    // soil mound at the base
    ctx.fillStyle = '#4a2e18';
    ctx.fillRect(pl.x - v.w * 0.45, base - 3, v.w * 0.9, f >= 1 ? 3 : 6);
    // growth percentage
    const pct = Math.floor(f * 100) + '%';
    ctx.font = 'bold 12px "Courier New", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = '#2a1a0d'; ctx.strokeText(pct, pl.x, base + 13);
    ctx.fillStyle = f >= 1 ? '#b5e655' : '#ffffff'; ctx.fillText(pct, pl.x, base + 13);
  });
  ctx.imageSmoothingEnabled = prev;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (scene === 'greenhouse') {
    if (soilImg.complete && soilImg.naturalWidth) ctx.drawImage(soilImg, 0, 0, canvas.width, canvas.height);
    // vegetables standing behind the player are drawn first, the ones in front after
    drawPlants();
  } else if (scene === 'house') {
    drawHouseRoom();
  } else if (bg.complete && bg.naturalWidth) {
    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
  }

  drawPlayer();

  if (ask) drawAsk();
  drawHud();
  drawApp();
  if (showLabels) drawLabels();
  drawPopup();
  drawEvent();
  if (debug) drawDebug();
  if (dash.open) drawDash();

  if (gameOver) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 960, 540);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 48px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('GAME OVER', 480, 270);
    if (gameOverReason) { ctx.font = '20px "Courier New", monospace'; ctx.fillText(gameOverReason, 480, 320); }
  }
}

// ================= DUST STORM  =================
const DUST_SECONDS = 90;
const DAMAGE_AFTER = 30;
let shieldOn = false;
let greenhouseMarks = [];

events.push({ day: 502, hour: 3, type: 'dust' });

function dustLines() {
  const s = Math.max(0, Math.ceil(ev.t));
  if (ev.waiting && !ev.damage) return [
    { text: 'Alert: Dust Storm coming in approx. 2 mins. Collect food and store energy. Attach electrodynamic dust shield to the solar panels.' }];
  if (ev.waiting && ev.damage) return [
    { text: 'Warning: the structure of the greenhouse is unstable!' },
    { text: 'Go repair it. Click the two ! marks next to the greenhouse.' }];
  const left = cropsLeft(), fixed = greenhouseMarks.filter(m => m.fixed).length;
  const lines = [
    { text: 'A dust storm is coming. It arrives in ' + mmss(s) + '.' },
    { text: '1. Collect all ripe crops (' + left + ' left)', done: left === 0 },
    { text: '2. Store energy / stop solar panels', done: solarStopped },
    { text: '3. Attach dust shield to the solar panels', done: shieldOn }];
  if (ev.damage) lines.push({ text: '4. Repair the greenhouse (' + fixed + '/2)', done: fixed === 2 });
  return lines;
}

function updateDust(dt) {
  ev.t -= dt;
  if (!ev.damage && ev.t <= DUST_SECONDS - DAMAGE_AFTER) {
    ev.damage = true;
    ev.waiting = true;
    greenhouseMarks = [{ x: 50, y: 305, fixed: false }, { x: 275, y: 305, fixed: false }];
    return;
  }
  if (ev.t > 0) return;
  let n = 0;
  ev.targets.forEach(p => { if (plants.includes(p) && !p.dead) { p.dead = true; n++; } });
  ev.result.push(n ? n + ' ripe crop' + (n > 1 ? 's' : '') + ' died.' : 'All ripe crops were saved.');
  if (!shieldOn) { solarDead = true; ev.result.push('The solar panels are buried in dust.'); }
  else ev.result.push('The dust shield protected the solar panels.');
  if (!solarStopped) { energy = Math.round(energy / 2); ev.result.push('Half of your stored energy was lost.'); }
  else ev.result.push('Your stored energy is safe.');
  if (greenhouseMarks.some(m => !m.fixed)) { plants.forEach(p => { p.dead = true; }); ev.result.push('The greenhouse broke. All plants died.'); }
  else ev.result.push('The greenhouse held up.');
  greenhouseMarks = [];
  shieldOn = false;
  ev.phase = 'done';
}

function drawMarks() {
  greenhouseMarks.forEach(m => {
    if (m.fixed) return;
    const bob = Math.sin(performance.now() / 200) * 4;
    ctx.save();
    ctx.translate(m.x, m.y + bob);
    ctx.fillStyle = '#ffd23f';
    ctx.strokeStyle = '#4a2e18';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(20, 12); ctx.lineTo(-20, 12); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4a2e18';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, 3);
    ctx.restore();
  });
}

const _eventLines = eventLines;
eventLines = function () {
  return ev && ev.type === 'dust' ? dustLines() : _eventLines();
};

const _startEvent = startEvent;
startEvent = function (e) {
  _startEvent(e);
  if (e.type === 'dust') {
    ev.t = DUST_SECONDS;
    ev.targets = plants.filter(p => !p.dead && growth(p) >= 1);
    ev.damage = false;
  }
};

const _updateEvent = updateEvent;
updateEvent = function (dt) {
  if (ev.type === 'dust') updateDust(dt);
  else _updateEvent(dt);
};

const _drawEvent = drawEvent;
drawEvent = function () {
  if (!ev || ev.type !== 'dust' || ev.waiting) return _drawEvent();
  if (ev.phase === 'done') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const lines = ev.result, h = 110 + lines.length * 26;
    panel(220, 270 - h / 2, 520, h);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3b2412';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText('The dust storm has finished.', 480, 270 - h / 2 + 32);
    ctx.font = 'bold 15px "Courier New", monospace';
    lines.forEach((l, i) => ctx.fillText(l, 480, 270 - h / 2 + 66 + i * 26));
    ctx.fillText('Click or press Enter to continue', 480, 270 + h / 2 - 22);
    return;
  }
  const s = Math.max(0, Math.ceil(ev.t));
  ctx.fillStyle = Math.floor(ev.t * 2) % 2 ? '#b82424' : '#7a1010';
  ctx.fillRect(330, 12, 300, 30);
  ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(330, 12, 300, 30);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('DUST STORM ' + mmss(s), 480, 28);
};

const _outsideClick = outsideClick;
outsideClick = function (p) {
  const mk = greenhouseMarks.find(m => !m.fixed && Math.hypot(p.x - m.x, p.y - m.y) <= 28);
  if (mk) {
    if (Math.hypot(player.x - mk.x, player.y - mk.y) > 110) { toast = { text: 'Walk closer to the greenhouse.', t: 2 }; return; }
    openYesNo(mk.x, mk.y, 'Repair this part of the greenhouse?', () => {
      mk.fixed = true;
      toast = { text: 'Greenhouse repaired!', t: 2 };
      if (greenhouseMarks.every(m => m.fixed)) popups.push({ text: 'Greenhouse repaired', t: 3 });
    });
    return;
  }
  const r = solarRects.find(r => hit(r, p, 6));
  if (r && ev && ev.type === 'dust' && ev.phase === 'go' && !shieldOn) {
    if (!solarRects.some(q => nearRect(q, 90))) { toast = { text: 'Walk closer to the solar panels.', t: 2 }; return; }
    const m = mid(r);
    openYesNo(m.x, m.y + 30, 'Attach the electrodynamic\ndust shield to the solar panels?', () => {
      shieldOn = true;
      toast = { text: 'Dust shield attached!', t: 2.5 };
    });
    return;
  }
  _outsideClick(p);
};

const _newDay = newDay;
newDay = function () {
  greenhouseMarks = [];
  shieldOn = false;
  _newDay();
};

const _draw = draw;
draw = function () {
  _draw();
  if (scene === 'outside' && !gameOver && !dash.open && !(ev && ev.waiting)) drawMarks();
};

  if (!r.ok) throw new Error(path + ' ' + r.status);

    .map(f => ({ type: 'flare', classType: f.classType, date: (f.beginTime || '').slice(0, 10), region: f.activeRegionNum || null, live: true }))
    .sort((a, b) => flareStrength(b.classType) - flareStrength(a.classType)).slice(0, 4);
}
function parseCmes(list) {
  const out = [];
  (Array.isArray(list) ? list : []).forEach(c => {
    const an = (c.cmeAnalyses || []).find(a => a.isMostAccurate) || (c.cmeAnalyses || [])[0];

    C(c.x, c.y, 560, 395, 'Kitchen: cook or eat\n1 meal or 2 raw crops a day');
    C(d.x, d.y, 640, 70, 'Bed\nwalk up to sleep');
    C(563, 520, 400, 505, 'Exit\nwalk to the bottom');
  } else {
    const ripe = plants.find(p => !p.dead && growth(p) >= 1) || plants[0];
    const young = plants.find(p => !p.dead && growth(p) < 1 && p !== ripe);
    if (ripe) C(ripe.x, ripe.y, ripe.x < 480 ? ripe.x + 210 : ripe.x - 210, Math.max(70, ripe.y - 70), 'Ripe: shows 100%\nstand close, press E\n(basket holds 5)');
    if (young) C(young.x, young.y, young.x < 480 ? young.x + 210 : young.x - 210, Math.min(440, young.y + 70), 'Under 100%\nnot ready yet');
    C(480, 528, 250, 505, 'Exit\nwalk off the bottom');
  }
}

function drawKey(x, y, w, h, label) {
  ctx.fillStyle = '#e9dcc0'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#c9b88f'; ctx.fillRect(x + 3, y + h - 7, w - 6, 4);
  ctx.fillStyle = '#3b2412'; ctx.font = 'bold 15px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 - 2);
}
function keyLabel(x, y, h, text) {
  ctx.font = '13px "Courier New", monospace'; ctx.fillStyle = '#3b2412'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const ls = wrapLines([{ text }], 100);
  ls.forEach((l, i) => ctx.fillText(l.text, x, y + h / 2 - (ls.length - 1) * 8 + i * 16));
}
function drawTutBasics() {
  const x0 = TX + 34;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#7a3a14'; ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('MOVE', x0, TY + 118);
  drawKey(x0 + 44, TY + 132, 38, 38, 'W'); drawKey(x0, TY + 174, 38, 38, 'A');
  drawKey(x0 + 44, TY + 174, 38, 38, 'S'); drawKey(x0 + 88, TY + 174, 38, 38, 'D');
  ctx.fillStyle = '#3b2412'; ctx.textAlign = 'center'; ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText('or', x0 + 152, TY + 193);
  const ax = x0 + 178;
  drawKey(ax + 44, TY + 132, 38, 38, '\u25B2'); drawKey(ax, TY + 174, 38, 38, '\u25C0');
  drawKey(ax + 44, TY + 174, 38, 38, '\u25BC'); drawKey(ax + 88, TY + 174, 38, 38, '\u25B6');
  const mx = x0 + 400, my = TY + 126;   // mouse
  ctx.fillStyle = '#e9dcc0'; ctx.fillRect(mx, my, 44, 66);
  ctx.fillStyle = '#ec6a3f'; ctx.fillRect(mx + 2, my + 2, 20, 26);
  ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(mx, my, 44, 66);
  ctx.beginPath(); ctx.moveTo(mx, my + 30); ctx.lineTo(mx + 44, my + 30); ctx.moveTo(mx + 22, my); ctx.lineTo(mx + 22, my + 30); ctx.stroke();
  ctx.textAlign = 'left'; ctx.fillStyle = '#7a3a14'; ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('CLICK', mx + 60, my + 14);
  ctx.fillStyle = '#3b2412'; ctx.font = '13px "Courier New", monospace';
  ctx.fillText('objects you are', mx + 60, my + 36); ctx.fillText('standing near', mx + 60, my + 54);
  ctx.textAlign = 'center'; ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText('Walk close to an object, then press E (or click it).', TX + TW / 2, TY + 246);
  const row = (y, list) => {
    let x = x0;
    list.forEach(it => {
      const w = it[0].length > 3 ? 72 : it[0].length > 1 ? 56 : 38;
      drawKey(x, y, w, 38, it[0]); keyLabel(x + w + 10, y, 38, it[1]); x += 168;
    });
  };
  row(TY + 282, [['I', 'Show names of objects'], ['R', 'Weather app'], ['H', 'Trainer guide'], ['T', 'How to play']]);
  row(TY + 350, [['Y / N', 'Yes or No'], ['Enter', 'Continue'], ['Esc', 'Close a window']]);
  row(TY + 408, [['E', 'Use the nearby object'], ['V', 'Show / hide status bars']]);
}

function drawTutDangers() {
  const cards = [
    { t: 'SOLAR FLARE', c: '#e8a417', s: ['1. Go inside the house', '2. Stay inside until it ends'] },
    { t: 'CME', c: '#d9642b', s: ['1. Pick all ripe crops', '2. Go inside the house', '3. Store energy: stop the solar panels', '4. Restart the panels later'] },
    { t: 'DUST STORM', c: '#b8854a', s: ['1. Pick crops', '2. Store energy', '3. Click the panels: dust shield', '4. Fix the ! marks'] }
  ];
  cards.forEach((cd, i) => {
    const x = TX + 28 + i * 220, y = TY + 112, w = 208, h = 330, cx = x + w / 2;
    ctx.fillStyle = '#efe0bf'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = cd.c; ctx.fillRect(x, y, w, 100);
    ctx.strokeStyle = '#4a2e18'; ctx.beginPath(); ctx.moveTo(x, y + 100); ctx.lineTo(x + w, y + 100); ctx.stroke();
    ctx.strokeStyle = '#fff6d0'; ctx.fillStyle = '#fff6d0'; ctx.lineWidth = 3;
    if (i === 0) {
      ctx.beginPath(); ctx.arc(cx, y + 50, 16, 0, 6.28); ctx.fill();
      for (let a = 0; a < 8; a++) { const r = a * Math.PI / 4; ctx.beginPath(); ctx.moveTo(cx + Math.cos(r) * 24, y + 50 + Math.sin(r) * 24); ctx.lineTo(cx + Math.cos(r) * 38, y + 50 + Math.sin(r) * 38); ctx.stroke(); }
    } else if (i === 1) {
      ctx.beginPath(); ctx.arc(cx - 30, y + 50, 14, 0, 6.28); ctx.fill();
      for (let r = 26; r <= 62; r += 18) { ctx.beginPath(); ctx.arc(cx - 30, y + 50, r, -0.7, 0.7); ctx.stroke(); }
    } else {
      for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.moveTo(cx - 44, y + 32 + j * 18); for (let q = 0; q <= 88; q += 8) ctx.lineTo(cx - 44 + q, y + 32 + j * 18 + Math.sin(q / 9 + j) * 5); ctx.stroke(); }
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3b2412'; ctx.font = 'bold 17px "Courier New", monospace';
    ctx.fillText(cd.t, cx, y + 124);
    ctx.textAlign = 'left'; ctx.font = '14px "Courier New", monospace';
    let ty = y + 156;
    cd.s.forEach(s => { wrapLines([{ text: s }], w - 32).forEach(l => { ctx.fillText(l.text, x + 16, ty); ty += 19; }); ty += 8; });
  });
  ctx.textAlign = 'center'; ctx.fillStyle = '#3b2412'; ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText('Every day: eat, refill oxygen, and restart the panels when it is safe.', TX + TW / 2, TY + 466);
}

function drawTut() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 960, 540);
  panel(TX, TY, TW, TH);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3b2412';
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.fillText('How to Play', TX + 22, TY + 30);
  const c = tutCloseRect();
  ctx.fillStyle = '#c8402a'; ctx.fillRect(c.x, c.y, c.w, c.h);
  ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(c.x, c.y, c.w, c.h);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 18px Arial';
  ctx.fillText('X', c.x + c.w / 2, c.y + c.h / 2 + 1);
  TUT_TABS.forEach((name, i) => {
    const r = tutTabRect(i);
    ctx.fillStyle = TUT.page === i ? '#6a9a1f' : '#f3e3c3'; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = TUT.page === i ? '#1d2a05' : '#3b2412'; ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText(name, r.x + r.w / 2, r.y + r.h / 2);
  });
  if (TUT.page === 0) drawTutBasics();
  else if (TUT.page === 1) drawTutScene('outside');
  else if (TUT.page === 2) drawTutScene('house');
  else if (TUT.page === 3) drawTutScene('greenhouse');
  else drawTutDangers();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#6b4a2a'; ctx.font = 'italic 12px "Courier New", monospace';
  ctx.fillText('Page ' + (TUT.page + 1) + ' of ' + TUT_TABS.length + '. Left / Right arrows change page. T, Esc or X closes.', TX + TW / 2, TY + TH - 14);
}

function drawTutBtn() {
  panel(tutBtn.x, tutBtn.y, tutBtn.w, tutBtn.h);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3b2412';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText('How to play (T)', tutBtn.x + tutBtn.w / 2, tutBtn.y + tutBtn.h / 2);
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (TUT.open) {
    if (k === 't' || k === 'escape') TUT.open = false;
    if (k === 'arrowleft' || k === 'a') TUT.page = (TUT.page + TUT_TABS.length - 1) % TUT_TABS.length;
    if (k === 'arrowright' || k === 'd') TUT.page = (TUT.page + 1) % TUT_TABS.length;
    e.stopImmediatePropagation(); e.preventDefault();
    return;
  }
  if (k === 't' && !gameOver && !dash.open && !dayOver && !guide.open) { openTut(); e.stopImmediatePropagation(); }
}, true);

window.addEventListener('click', e => {
  if (e.target !== canvas) return;
  const p = canvasPoint(e);
  if (TUT.open) {
    if (inRect(p, tutCloseRect())) TUT.open = false;
    TUT_TABS.forEach((n, i) => { if (inRect(p, tutTabRect(i))) TUT.page = i; });
    e.stopImmediatePropagation();
    return;
  }
  if (tutBtnVisible() && inRect(p, tutBtn)) { openTut(); e.stopImmediatePropagation(); }
}, true);

const _updateTut = update;
update = function (dt) {
  if (!TUT.seen && !TUT.open && !dash.open && !guide.open && !gameOver) openTut();   // opens once, the first time you start
  if (TUT.open) return;
  _updateTut(dt);
};

const _drawTut = draw;
draw = function () {
  _drawTut();
  if (TUT.open) drawTut();
  else if (tutBtnVisible()) drawTutBtn();
};
// ================= END HOW TO PLAY TUTORIAL =================

// ================= TRAINER GUIDE =================
const guide = { open: false, page: 0 };
const GUIDE_TABS = ['Solar flare', 'CME', 'Dust storm', 'Words to know'];

const GUIDE = [
  [
    { h: 'What is it?', t: 'A sudden flash of light and energy from the Sun. It starts near busy patches called active regions.' },
    { h: 'Why does it matter?', t: 'The flash reaches us within minutes. Some flares are followed by fast particles that can harm astronauts and electronics.' },
    { h: 'What do you do?', t: 'Go inside your house before the timer ends, then stay inside until the danger is over.' },
    { h: 'Real NASA data', t: 'NASA DONKI lists real flares and gives each a class: A, B, C, M, or X. Each class is ten times stronger than the one before.' }
  ],
  [
    { h: 'What is it?', t: 'A CME (coronal mass ejection) is a giant cloud of charged particles thrown out by the Sun, often from an active region (AR).' },
    { h: 'Why does it matter?', t: 'It is slower than a flare, taking hours to days to arrive, so scientists can forecast it. Strong ones can disturb electronics and power systems.' },
    { h: 'What do you do?', t: 'Collect all ripe crops, go inside, and store energy (stop the solar panels) before the timer ends.' },
    { h: 'Real NASA data', t: 'DONKI scientists estimate each CME\'s speed, from a few hundred to over 2,000 km/s, and the region of the Sun it came from.' }
  ],
  [
    { h: 'What is it?', t: 'Wind lifts fine Martian dust into the air. A dust storm can cover a small area or a whole planet and last days to weeks.' },
    { h: 'Why does it matter?', t: 'Dust blocks sunlight, so solar panels make much less power. It also settles on panels and equipment.' },
    { h: 'What do you do?', t: 'Collect food, store energy, attach the electrodynamic dust shield to the solar panels, and repair the greenhouse at the ! marks.' },
    { h: 'Real NASA research', t: 'NASA is developing electrodynamic dust shields. They use electric fields to push dust off surfaces without touching them.' }
  ]
];

const GLOSSARY = [
  ['Solar flare', 'A sudden flash of light and energy from the Sun.'],
  ['CME', 'Coronal mass ejection: a giant cloud of charged particles from the Sun.'],
  ['Active region (AR)', 'A busy patch of the Sun where flares and CMEs often start.'],
  ['Radiation', 'Energy and fast particles that can harm people and electronics.'],
  ['Sol', 'One day on Mars: about 24 hours and 39 minutes.'],
  ['Electrodynamic dust shield', 'Electric fields that push dust off a surface.'],
  ['DONKI', "NASA's Space Weather Database Of Notifications, Knowledge, Information."]
];

const GX = 130, GY = 24, GW = 700, GH = 492;
const guideBtn = { x: 12, y: 48, w: 150, h: 30 };
function guideTabRect(i) { return { x: GX + 20 + i * 167, y: GY + 54, w: 158, h: 32 }; }
function guideCloseRect() { return { x: GX + GW - 42, y: GY + 10, w: 30, h: 30 }; }
function guideBtnVisible() {
  return hudOpen && !gameOver && !dash.open && !guide.open && !dayOver && !ask && !(ev && (ev.waiting || ev.phase === 'done'));
}
function openGuide() {
  if (ev && { flare: 0, cme: 1, dust: 2 }[ev.type] !== undefined) guide.page = { flare: 0, cme: 1, dust: 2 }[ev.type];
  guide.open = true;
}

function drawGuide() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 960, 540);
  panel(GX, GY, GW, GH);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3b2412';
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.fillText('Trainer Guide', GX + 22, GY + 30);
  const c = guideCloseRect();
  ctx.fillStyle = '#c8402a'; ctx.fillRect(c.x, c.y, c.w, c.h);
  ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(c.x, c.y, c.w, c.h);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 18px Arial';
  ctx.fillText('X', c.x + c.w / 2, c.y + c.h / 2 + 1);
  GUIDE_TABS.forEach((name, i) => {
    const r = guideTabRect(i);
    ctx.fillStyle = guide.page === i ? '#6a9a1f' : '#f3e3c3'; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = guide.page === i ? '#1d2a05' : '#3b2412'; ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText(name, r.x + r.w / 2, r.y + r.h / 2);
  });
  let y = GY + 112;
  ctx.textAlign = 'left';
  if (guide.page < 3) {
    GUIDE[guide.page].forEach(s => {
      ctx.font = 'bold 16px "Courier New", monospace'; ctx.fillStyle = '#7a3a14';
      ctx.fillText(s.h, GX + 24, y); y += 22;
      ctx.font = '14px "Courier New", monospace'; ctx.fillStyle = '#3b2412';
      wrapLines([{ text: s.t }], GW - 48).forEach(l => { ctx.fillText(l.text, GX + 24, y); y += 19; });
      y += 12;
    });
  } else {
    GLOSSARY.forEach(g => {
      ctx.font = 'bold 15px "Courier New", monospace'; ctx.fillStyle = '#7a3a14';
      ctx.fillText(g[0], GX + 24, y); y += 20;
      ctx.font = '14px "Courier New", monospace'; ctx.fillStyle = '#3b2412';
      wrapLines([{ text: g[1] }], GW - 48).forEach(l => { ctx.fillText(l.text, GX + 24, y); y += 19; });
      y += 8;
    });
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#6b4a2a'; ctx.font = 'italic 12px "Courier New", monospace';
  ctx.fillText('Left / Right arrows change page. Esc or X closes. Flare and CME data: NASA DONKI.', GX + GW / 2, GY + GH - 16);
}

function drawGuideBtn() {
  panel(guideBtn.x, guideBtn.y, guideBtn.w, guideBtn.h);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3b2412';
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillText('Guide (H)', guideBtn.x + guideBtn.w / 2, guideBtn.y + guideBtn.h / 2);
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (guide.open) {
    if (k === 'escape' || k === 'h') guide.open = false;
    if (k === 'arrowleft' || k === 'a') guide.page = (guide.page + 3) % 4;
    if (k === 'arrowright' || k === 'd') guide.page = (guide.page + 1) % 4;
    e.stopImmediatePropagation(); e.preventDefault();
    return;
  }
  if (k === 'h' && !gameOver && !dash.open && !dayOver) { openGuide(); e.stopImmediatePropagation(); }
}, true);

window.addEventListener('click', e => {
  if (e.target !== canvas) return;
  const p = canvasPoint(e);
  if (guide.open) {
    if (inRect(p, guideCloseRect())) guide.open = false;
    GUIDE_TABS.forEach((n, i) => { if (inRect(p, guideTabRect(i))) guide.page = i; });
    e.stopImmediatePropagation();
    return;
  }
  if (guideBtnVisible() && inRect(p, guideBtn)) { openGuide(); e.stopImmediatePropagation(); }
}, true);

const _eventLinesGuide = eventLines;
eventLines = function () {
  const lines = _eventLinesGuide();
  if (ev && ev.waiting) lines.push({ text: 'Press H to learn more.' });
  return lines;
};

const _updateGuide = update;
update = function (dt) {
  if (guide.open) return;
  _updateGuide(dt);
};

const _drawGuide = draw;
draw = function () {
  _drawGuide();
  if (guide.open) drawGuide();
  else if (guideBtnVisible()) drawGuideBtn();
};
// ================= END TRAINER GUIDE =================

// ================= DROP-DOWN HUD + NEAR-OBJECT PROMPTS =================
const hudTab = { x: 170, y: 0, w: 110, h: 20 };   // the little tab at the top that opens/closes the status bars

function tabVisible() {
  return !cover.open && !gameOver && !dash.open && !TUT.open && !guide.open && !dayOver &&
         !(ev && (ev.waiting || ev.phase === 'done'));
}
function uiFree() { return tabVisible() && !ask && !refill && !debug; }
function distTo(r) {
  const cx = player.x, cy = player.y - player.h / 2;
  return Math.hypot(Math.max(r[0] - cx, 0, cx - (r[0] + r[2])), Math.max(r[1] - cy, 0, cy - (r[1] + r[3])));
}

// Finds the closest object you can use right now: { rect, label, run }
function nearbyAction() {
  if (!uiFree()) return null;
  let best = null;
  const add = (rect, d, label, run) => { if (!best || d < best.d) best = { rect, d, label, run, d }; };
  if (scene === 'house') {
    [[oxygenRect, tasks[2].done ? 'Oxygen tank (full)' : 'Refill oxygen'],
     [storageRect, solarStopped ? 'Restart solar panels' : 'Store energy / stop panels'],
     [binRect, basket > 0 ? 'Empty basket into bin' : 'Check the bin'],
     [bowlRect, 'Cook / eat']
    ].forEach(([r, label]) => { const d = distTo(r); if (d <= HOUSE_REACH) add(r, d, label, () => houseClick(mid(r))); });
  } else if (scene === 'outside') {
    const shield = ev && ev.type === 'dust' && ev.phase === 'go' && !shieldOn;
    solarRects.forEach(r => { const d = distTo(r); if (d <= 90) add(r, d, shield ? 'Attach dust shield' : 'Check solar panels', () => outsideClick(mid(r))); });
    greenhouseMarks.filter(m => !m.fixed).forEach(m => {
      const d = Math.hypot(player.x - m.x, player.y - m.y);
      if (d <= 110) add([m.x - 20, m.y - 22, 40, 34], d, 'Repair greenhouse', () => outsideClick({ x: m.x, y: m.y }));
    });
  } else if (scene === 'greenhouse') {
    plants.forEach(pl => {
      const d = Math.hypot(pl.x - player.x, pl.y - player.h / 2 - player.y);
      if (d > REACH) return;
      const q = plantRect(pl), n = vegTypes[pl.t].name;
      const label = pl.dead ? 'Clear dead ' + n : growth(pl) >= 1 ? 'Pick ' + n : n + ' (' + Math.floor(growth(pl) * 100) + '% grown)';
      add([q.x, q.y, q.w, q.h], d, label, () => plantClick({ x: q.x + q.w / 2, y: q.y + q.h / 2 }));
    });
  }
  return best;
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'v' && tabVisible()) { hudOpen = !hudOpen; e.stopImmediatePropagation(); return; }
  if (k === 'e') {
    const a = nearbyAction();
    if (a) { a.run(); e.stopImmediatePropagation(); e.preventDefault(); }
  }
}, true);

window.addEventListener('click', e => {
  if (e.target !== canvas || !tabVisible()) return;
  if (inRect(canvasPoint(e), hudTab)) { hudOpen = !hudOpen; e.stopImmediatePropagation(); }
}, true);

const _drawPrompt = draw;
draw = function () {
  _drawPrompt();
  if (!tabVisible()) return;
  // drop-down tab
  ctx.fillStyle = '#f3e3c3'; ctx.fillRect(hudTab.x, hudTab.y, hudTab.w, hudTab.h);
  ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 3; ctx.strokeRect(hudTab.x, hudTab.y, hudTab.w, hudTab.h);
  ctx.fillStyle = '#3b2412'; ctx.font = 'bold 12px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText((hudOpen ? '\u25B2 Hide' : '\u25BC Status') + ' (V)', hudTab.x + hudTab.w / 2, hudTab.y + hudTab.h / 2);
  // near-object prompt
  const a = nearbyAction();
  if (!a) return;
  ctx.save();
  ctx.setLineDash([5, 4]); ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 2;
  ctx.strokeRect(a.rect[0] - 3, a.rect[1] - 3, a.rect[2] + 6, a.rect[3] + 6);
  ctx.setLineDash([]);
  ctx.font = 'bold 16px "Courier New", monospace';
  const text = a.label + ' (E)', w = ctx.measureText(text).width + 36;
  ctx.fillStyle = 'rgba(16,21,43,0.92)'; ctx.fillRect(480 - w / 2, 448, w, 32);
  ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 2; ctx.strokeRect(480 - w / 2, 448, w, 32);
  ctx.fillStyle = '#ffe14a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 480, 464);
  ctx.restore();
};
// ================= END DROP-DOWN HUD + PROMPTS =================

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
